
name: GitHub Pages

on:
  push:
    branches:
      - 'devel'
    # paths:
    #   - 'src/**/*'
    #   - 'example/**/*'

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        nim: [ '2.0.16' ]
    name: Nim ${{ matrix.nim }} sample
    steps:
      - uses: actions/checkout@v2
      - name: Setup nim
        uses: alaviss/setup-nim@0.1.1
        with:
          path: 'nim'
          version: 'version-2-0'
      - name: Install dependencies
        run: |
          nimble install -d -Y
      - name: Insall web_preprocessor dependencies
        run: brew install libsass mozjpeg
      - name: Build
        run: nimble build
      - name: Build site
        run: |
          ./crown_ui build --cwd ./example
          nimble buildAssets
      - name: Deploy

        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./example/build
          cname: crown_ui.bungos.me
          publish_branch: ghpages # since not use Jekyll choose another branch